name: Optional Julia integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['R/**', 'tests/**', '.github/workflows/julia-integration.yaml']
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: '2'
      LANDCONN_RUN_JULIA: 'true'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Install verified Circuitscape version
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="Circuitscape", version="5.17.1"))'
      - name: Run spatial integration tests
        shell: Rscript {0}
        run: |
          julia <- normalizePath(Sys.which("julia"), winslash = "/")
          Sys.setenv(JULIA_BINDIR = dirname(julia))
          devtools::test(filter = "julia-integration", stop_on_failure = TRUE)
